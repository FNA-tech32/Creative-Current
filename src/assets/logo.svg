<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
    <defs>
        <linearGradient id="cc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d4ff00" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#00e5ff" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Emblem: Dynamic Current / Wave Icon -->
    <g transform="translate(10, 8)">
        <!-- Outer glow circle ring -->
        <circle cx="32" cy="32" r="30" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" />
        
        <!-- Current Waves -->
        <path d="M16 26 C22 18, 30 18, 36 24 C42 30, 48 30, 52 24" 
              stroke="url(#cc-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
        
        <path d="M12 34 C20 28, 28 28, 34 34 C40 40, 48 40, 54 34" 
              stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95" />
        
        <path d="M16 42 C22 36, 30 36, 36 42 C42 48, 48 48, 52 42" 
              stroke="#d4ff00" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)" />
        
        <!-- Energy Node -->
        <circle cx="48" cy="24" r="2.5" fill="#d4ff00" />
    </g>

    <!-- Brand Typography -->
    <g transform="translate(88, 12)">
        <!-- CREATIVE -->
        <text x="0" y="30" 
              fill="#ffffff" 
              font-family="'Clash Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="24" 
              font-weight="700" 
              letter-spacing="0.1em">CREATIVE</text>
        
        <!-- CURRENT -->
        <text x="1" y="49" 
              fill="#d4ff00" 
              font-family="'JetBrains Mono', 'Courier New', monospace" 
              font-size="12" 
              font-weight="600" 
              letter-spacing="0.32em">CURRENT</text>
    </g>
</svg>

